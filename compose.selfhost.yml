# Always combine with compose.yml. Set the required secrets and public domains first.
# Copy .env.production.example to .env and complete every required value before deploying.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
services:
  api:
    environment:
      NODE_ENV: production
      QB_PUBLIC_URL: https://${QB_API_DOMAIN:?set QB_API_DOMAIN}
      QB_STUDIO_URL: https://${QB_STUDIO_DOMAIN:?set QB_STUDIO_DOMAIN}
      QB_ALLOWED_ORIGINS: https://${QB_STUDIO_DOMAIN},${QB_APP_ORIGINS:?set exact QB_APP_ORIGINS}
      QB_MASTER_KEY: ${QB_MASTER_KEY:?set a protected master encryption key}
      QB_BOOTSTRAP_TOKEN: ${QB_BOOTSTRAP_TOKEN:?set a first-owner bootstrap token}
      QB_WORKER_TOKEN: ${QB_WORKER_TOKEN:?set a private worker token}
      QB_REQUIRE_ADMIN_MFA: 'true'
      QB_S3_ENDPOINT: ${QB_S3_ENDPOINT:?point at an S3-compatible backend (e.g. RustFS)}
      QB_S3_REGION: ${QB_S3_REGION:-us-east-1}
      QB_S3_BUCKET: ${QB_S3_BUCKET:-qb-flex}
      QB_S3_ACCESS_KEY: ${QB_S3_ACCESS_KEY:?set S3 credentials}
      QB_S3_SECRET_KEY: ${QB_S3_SECRET_KEY:?set S3 credentials}
      QB_RESEND_API_KEY: ${QB_RESEND_API_KEY:-}
      QB_SMTP_HOST: ${QB_SMTP_HOST:-}
      QB_SMTP_PORT: ${QB_SMTP_PORT:-587}
      QB_SMTP_USER: ${QB_SMTP_USER:-}
      QB_SMTP_PASSWORD: ${QB_SMTP_PASSWORD:-}
      QB_MAIL_FROM: ${QB_MAIL_FROM:-QB Flex <hello@localhost>}
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: '${QB_API_CPUS:-1.0}'
          memory: ${QB_API_MEMORY:-8g}
    logging: *logging
  storage-init:
    environment:
      QB_S3_ENDPOINT: ${QB_S3_ENDPOINT:?point at an S3-compatible backend (e.g. RustFS)}
      QB_S3_REGION: ${QB_S3_REGION:-us-east-1}
      QB_S3_BUCKET: ${QB_S3_BUCKET:-qb-flex}
      QB_S3_ACCESS_KEY: ${QB_S3_ACCESS_KEY}
      QB_S3_SECRET_KEY: ${QB_S3_SECRET_KEY}
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: '${QB_STORAGE_INIT_CPUS:-0.25}'
          memory: ${QB_STORAGE_INIT_MEMORY:-256m}
    logging: *logging
  worker:
    environment:
      QB_WORKER_TOKEN: ${QB_WORKER_TOKEN}
      QB_S3_ENDPOINT: ${QB_S3_ENDPOINT:?point at an S3-compatible backend (e.g. RustFS)}
      QB_S3_REGION: ${QB_S3_REGION:-us-east-1}
      QB_S3_BUCKET: ${QB_S3_BUCKET:-qb-flex}
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: '${QB_WORKER_CPUS:-0.5}'
          memory: ${QB_WORKER_MEMORY:-512m}
    logging: *logging
  studio:
    environment:
      NODE_ENV: production
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    build:
      args:
        VITE_API_URL: https://${QB_API_DOMAIN}
        VITE_DOCS_URL: https://${QB_DOCS_DOMAIN:?set QB_DOCS_DOMAIN}
        VITE_STUDIO_URL: https://${QB_STUDIO_DOMAIN}
        QB_DOCS_URL: https://${QB_DOCS_DOMAIN}
    deploy:
      resources:
        limits:
          cpus: '${QB_STUDIO_CPUS:-0.5}'
          memory: ${QB_STUDIO_MEMORY:-512m}
    logging: *logging
  docs:
    environment:
      NODE_ENV: production
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    build:
      args:
        VITE_API_URL: https://${QB_API_DOMAIN}
        VITE_DOCS_URL: https://${QB_DOCS_DOMAIN}
        VITE_STUDIO_URL: https://${QB_STUDIO_DOMAIN}
        QB_DOCS_URL: https://${QB_DOCS_DOMAIN}
    deploy:
      resources:
        limits:
          cpus: '${QB_DOCS_CPUS:-0.5}'
          memory: ${QB_DOCS_MEMORY:-512m}
    logging: *logging
  gateway:
    image: caddy@sha256:1a81ac3d1a49b2b385a5bfafb8bd39fb40fa1d717461d825ee0d65df91a6e97b
    profiles: [selfhost]
    environment:
      QB_API_DOMAIN: ${QB_API_DOMAIN}
      QB_STUDIO_DOMAIN: ${QB_STUDIO_DOMAIN}
      QB_DOCS_DOMAIN: ${QB_DOCS_DOMAIN}
    security_opt: ['no-new-privileges:true']
    ports: ['80:80', '443:443']
    volumes: ['./infra/Caddyfile:/etc/caddy/Caddyfile:ro', 'gateway:/data']
    depends_on:
      api:
        condition: service_healthy
      studio:
        condition: service_healthy
      docs:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${QB_GATEWAY_CPUS:-0.25}'
          memory: ${QB_GATEWAY_MEMORY:-256m}
    logging: *logging
    restart: unless-stopped
volumes:
  gateway:
