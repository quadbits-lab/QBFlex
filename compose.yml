name: qb-flex
x-build: &build
  context: .
  dockerfile: infra/Dockerfile
x-environment: &environment
  QB_DATA_DIR: /var/lib/qb-flex
  QB_HOST: 0.0.0.0
  QB_PUBLIC_URL: http://localhost:7612
  QB_STUDIO_URL: http://localhost:7610
  QB_ALLOWED_ORIGINS: http://localhost:7610,http://127.0.0.1:7610,http://localhost:7617,http://127.0.0.1:7617,http://localhost:7618,http://127.0.0.1:7618
  QB_S3_ENDPOINT: ${QB_S3_ENDPOINT:-}
  QB_S3_REGION: ${QB_S3_REGION:-us-east-1}
  QB_S3_BUCKET: ${QB_S3_BUCKET:-qb-flex}
  QB_S3_ACCESS_KEY: ${QB_S3_ACCESS_KEY:-}
  QB_S3_SECRET_KEY: ${QB_S3_SECRET_KEY:-}
  QB_SMTP_HOST: mailpit
  QB_SMTP_PORT: 1025
services:
  mailpit:
    image: axllent/mailpit@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    profiles: [local, dependencies]
    ports: ['127.0.0.1:7615:1025', '127.0.0.1:7616:8025']
    restart: unless-stopped
  storage-init:
    build: { <<: *build, target: storage-init }
    profiles: [local, selfhost, dependencies]
    environment: *environment
    extra_hosts: ['host.docker.internal:host-gateway']
    restart: 'no'
  api:
    build: { <<: *build, target: api }
    profiles: [local, selfhost]
    extra_hosts: ['host.docker.internal:host-gateway']
    environment: *environment
    ports: ['127.0.0.1:7612:7612']
    volumes: [database:/var/lib/qb-flex]
    healthcheck:
      test:
        [CMD, bun, -e, 'const r=await fetch("http://localhost:7612/ready");process.exit(r.ok?0:1)']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  worker:
    build: { <<: *build, target: worker }
    profiles: [local, selfhost]
    extra_hosts: ['host.docker.internal:host-gateway']
    environment: { <<: *environment, QB_INTERNAL_API_URL: 'http://api:7612' }
    volumes: [database:/var/lib/qb-flex:ro]
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped
  studio:
    build: { <<: *build, target: studio }
    profiles: [local, selfhost]
    ports: ['127.0.0.1:7610:7610']
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped
  docs:
    build: { <<: *build, target: docs }
    profiles: [local, selfhost, docs]
    ports: ['127.0.0.1:7611:7611']
    restart: unless-stopped
volumes:
  database:
