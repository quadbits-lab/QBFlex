name: qb-flex
x-build: &build
  context: .
  dockerfile: infra/Dockerfile
x-environment: &environment
  # Images default to NODE_ENV=production; the local profile overrides back to
  # development so http://localhost remains valid outside the deployment overlays.
  NODE_ENV: ${NODE_ENV:-development}
  QB_DATA_DIR: /var/lib/qb-flex
  QB_HOST: 0.0.0.0
  QB_LOG_FORMAT: ${QB_LOG_FORMAT:-auto}
  QB_LOG_INTERNAL: ${QB_LOG_INTERNAL:-false}
  QB_MAX_BRANCH_OWNERS: ${QB_MAX_BRANCH_OWNERS:-4}
  QB_PUBLIC_URL: http://localhost:7612
  QB_STUDIO_URL: http://localhost:7610
  QB_ALLOWED_ORIGINS: http://localhost:7610,http://127.0.0.1:7610,http://localhost:7617,http://127.0.0.1:7617,http://localhost:7618,http://127.0.0.1:7618
  QB_S3_ENDPOINT: ${QB_S3_ENDPOINT:-}
  QB_S3_REGION: ${QB_S3_REGION:-us-east-1}
  QB_S3_BUCKET: ${QB_S3_BUCKET:-qb-flex}
  QB_S3_ACCESS_KEY: ${QB_S3_ACCESS_KEY:-}
  QB_S3_SECRET_KEY: ${QB_S3_SECRET_KEY:-}
  QB_SMTP_HOST: mailpit
  QB_SMTP_PORT: 1025
  QB_WEBHOOK_INTERNAL_ALLOWLIST: ${QB_WEBHOOK_INTERNAL_ALLOWLIST:-}
services:
  mailpit:
    image: axllent/mailpit@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    profiles: [local, dependencies]
    ports: ['127.0.0.1:7615:1025', '127.0.0.1:7616:8025']
    restart: unless-stopped
  storage-init:
    build: { <<: *build, target: storage-init }
    profiles: [local, selfhost, staging, dependencies]
    environment: *environment
    extra_hosts: ['host.docker.internal:host-gateway']
    restart: 'no'
  api:
    build: { <<: *build, target: api }
    profiles: [local, selfhost, staging]
    extra_hosts: ['host.docker.internal:host-gateway']
    environment: *environment
    ports: ['127.0.0.1:7612:7612']
    volumes: [database:/var/lib/qb-flex]
    healthcheck:
      test:
        [CMD, bun, -e, 'const r=await fetch("http://localhost:7612/ready");process.exit(r.ok?0:1)']
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build: { <<: *build, target: worker }
    profiles: [local, selfhost, staging]
    extra_hosts: ['host.docker.internal:host-gateway']
    environment: { <<: *environment, QB_INTERNAL_API_URL: 'http://api:7612' }
    volumes: [database:/var/lib/qb-flex:ro]
    healthcheck:
      test:
        [CMD, bun, -e, 'const u=(process.env.QB_INTERNAL_API_URL||"http://api:7612")+"/ready";fetch(u).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      api:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
  studio:
    build: { <<: *build, target: studio }
    profiles: [local, selfhost, staging]
    ports: ['127.0.0.1:7610:7610']
    depends_on:
      api:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [CMD, bun, -e, 'fetch("http://localhost:7610/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  docs:
    build: { <<: *build, target: docs }
    # No dependencies: the docs service is static content and must stay deployable
    # through the docs-only profile without starting the database stack.
    profiles: [local, selfhost, staging, docs]
    ports: ['127.0.0.1:7611:7611']
    healthcheck:
      test:
        [CMD, bun, -e, 'fetch("http://localhost:7611/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
volumes:
  database:
